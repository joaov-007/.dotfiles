[package]
name = "cg"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Organize and clean up ChatGPT history without deleting anything"
license = "MIT"
publish = false

[lib]
name = "cg"
path = "src/lib.rs"

[[bin]]
name = "cg"
path = "src/main.rs"

# Deliberately small dependency set:
#   * no async runtime, no generic HTTP framework, no ORM;
#   * system SQLite (Arch ships it with the headers);
#   * dev tests use std::process, not a CLI assertion framework.
[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.5", default-features = false, features = [
  "derive",
  "env",
  "error-context",
  "help",
  "std",
  "suggestions",
  "usage",
] }
clap_complete = { version = "4.5", default-features = false }
fastrand = "2"
fs2 = "0.4"
log = "0.4"
rusqlite = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
unicode-normalization = "0.1"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
unwrap_used = "warn"
expect_used = "warn"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
