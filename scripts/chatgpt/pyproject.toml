[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "S", "RUF"]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.bandit]
exclude_dirs = ["__pycache__", ".git"]

[tool.vulture]
min_confidence = 80
paths = ["cg.py", "cg_services.py", "test_cg.py"]
